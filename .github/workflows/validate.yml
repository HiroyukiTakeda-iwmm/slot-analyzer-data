name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main と比べる検査（ID の安定性・採否ルール）のため、全履歴を取る

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: バリデーション
        run: npm run validate

      - name: テスト
        run: npm test

      - name: 基準（main）との比較（PR のみ）
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-against-base.mjs --base "origin/$BASE_REF"

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "scripts/**/*.mjs" "tests/**/*.mjs" "*.mjs"

      - name: 品質レポート
        run: npm run quality
