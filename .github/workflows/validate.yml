name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: バリデーション
        run: npm run validate

      - name: テスト
        run: npm test

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "scripts/**/*.mjs" "tests/**/*.mjs" "*.mjs"

      - name: 品質レポート
        run: npm run quality
